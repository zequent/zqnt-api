name: Pull Request Workflow

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-java:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Run tests and build
        run: mvn -B clean verify

  publish-preview:
    permissions:
      contents: read
      packages: write
      pull-requests: write
      issues: write
    name: Publish Preview Version
    runs-on: ubuntu-latest
    needs: test-java
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate preview version
        id: version
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          PR_NUMBER=${{ github.event.pull_request.number }}
          BASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
          PREVIEW_VERSION="${BASE_VERSION}-PR${PR_NUMBER}-${COMMIT_SHA}-SNAPSHOT"
          echo "version=${PREVIEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${PREVIEW_VERSION}"

      - name: Update version in pom.xml
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Publish preview to GitHub Packages
        run: mvn -B deploy -DskipTests --settings .github/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Comment on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const commitSha = '${{ steps.version.outputs.commit_sha }}';
            const body = [
              '### Preview version published',
              '',
              `**Version:** \`${version}\` (commit \`${commitSha}\`)`,
              '',
              '```xml',
              '<dependency>',
              '    <groupId>com.zqnt</groupId>',
              '    <artifactId>zqnt-api-java</artifactId>',
              `    <version>${version}</version>`,
              '</dependency>',
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
