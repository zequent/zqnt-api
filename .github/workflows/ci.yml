name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUF_VERSION: "1.67.0"
  PROTOC_VERSION: "21.12"
  PROTOC_GEN_GO_VERSION: v1.36.11
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.1
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c

jobs:
  protos:
    name: Protos (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install buf
        run: |
          curl -fsSL -o "$RUNNER_TEMP/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          chmod +x "$RUNNER_TEMP/buf"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build
        run: buf build

      - name: Lint (v3 STANDARD, v2 MINIMAL)
        run: buf lint

      - name: Format
        run: buf format --diff --exit-code proto/v3

      - name: v2 stays wire- and JSON-compatible with 2.0.0
        run: buf breaking proto/v2 --against .github/buf/v2-2.0.0.binpb

      - name: v3 breaking report against the target branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: buf breaking proto/v3 --against ".git#branch=origin/${{ github.base_ref }},subdir=proto/v3"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 5m

      - name: Install protoc and the Go plugins
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate
        run: ./scripts/gen_protos.sh

      - name: gen/ matches proto/
        run: git diff --exit-code -- gen && test -z "$(git status --porcelain -- gen)"

  java:
    name: Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Test and build
        run: mvn -B clean verify

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Test
        run: uv run --frozen pytest -q

      - name: Regenerate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --frozen python scripts/gen_protos.py

      - name: zqnt_api/generated matches proto/
        run: test -z "$(git status --porcelain -- zqnt_api/generated)" || { git status --porcelain -- zqnt_api/generated; exit 1; }

      - name: Build
        run: uv build

  # Every PR build is tagged pr-<n>-<sha> (never v*: that would start a release). Go and Python
  # consumers pin that tag or the commit; Java consumers the preview published below.
  preview-tag:
    name: Tag PR preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [protos, secrets, go, java, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute preview tag
        id: tag
        run: |
          TAG="pr-${{ github.event.pull_request.number }}-$(git rev-parse --short=7 HEAD)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "Preview tag: \`${TAG}\` (commit $(git rev-parse HEAD))"
            echo ""
            echo "- Go: \`go get github.com/zequent/zqnt-api/go/v3@${TAG}\`"
            echo "- Python: \`zqnt-api = { git = \"https://github.com/zequent/zqnt-api\", subdirectory = \"python\", tag = \"${TAG}\" }\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push preview tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.tag.outputs.tag }}"

  java-preview:
    name: Publish Java preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [protos, secrets, go, java, python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      issues: write
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Preview version
        id: version
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          BASE=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
          VERSION="${BASE}-PR${{ github.event.pull_request.number }}-${SHA}-SNAPSHOT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Java preview: \`com.zqnt:zqnt-api:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Publish to GitHub Packages
        run: mvn -B deploy -DskipTests --settings ../.github/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Comment on the PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const body = [
              '### Preview published',
              '',
              '```xml',
              '<dependency>',
              '    <groupId>com.zqnt</groupId>',
              '    <artifactId>zqnt-api</artifactId>',
              `    <version>${version}</version>`,
              '</dependency>',
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
