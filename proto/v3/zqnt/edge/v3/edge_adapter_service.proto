syntax = "proto3";

// The two directions between the platform and an edge adapter.
//
//   EdgeAdapterService  implemented by every adapter (through the edge SDK), called by the platform.
//   EdgeGatewayService  implemented by the platform, called by adapters to report what they know.
//
// There is no per-command RPC: takeoff, go-to, cover, stream, reboot, vendor commands all go
// through ExecuteCommand with a dotted command id. Only manual control and detections keep their
// own streaming RPCs, because they are continuous high-rate streams, not commands.
package zqnt.edge.v3;

import "google/protobuf/timestamp.proto";
import "zqnt/capability/v3/capability.proto";
import "zqnt/capability/v3/command.proto";
import "zqnt/common/v3/common.proto";

option go_package = "github.com/zequent/zqnt-api/go/v3/gen/zqnt/edge/v3;edgev3";
option java_multiple_files = true;
option java_package = "com.zqnt.protos.edge.v3";

service EdgeAdapterService {
  // What the asset can do now. Derived by the SDK from the registered command handlers.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  // Runs one command. Returns SUCCEEDED/FAILED/REJECTED for quick commands, ACCEPTED for long
  // ones, whose completion follows through EdgeGatewayService.PublishCommandEvent.
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc CancelCommand(CancelCommandRequest) returns (CancelCommandResponse);
  // Continuous stick input while manual control (`flight.manual.enter`) is active.
  rpc StreamManualControl(stream StreamManualControlRequest) returns (StreamManualControlResponse);
  // Detections of the asset's onboard or attached detector.
  rpc StreamDetections(StreamDetectionsRequest) returns (stream StreamDetectionsResponse);
}

service EdgeGatewayService {
  // The full capability snapshot of an asset, sent on start and whenever it changes.
  rpc ReportCapabilities(ReportCapabilitiesRequest) returns (ReportCapabilitiesResponse);
  // Progress and completion of an ACCEPTED command.
  rpc PublishCommandEvent(PublishCommandEventRequest) returns (PublishCommandEventResponse);
}

message GetCapabilitiesRequest {
  zqnt.common.v3.RequestContext context = 1;
  zqnt.common.v3.AssetRef asset = 2;
  // Unset = every target of the asset.
  zqnt.capability.v3.Target target = 3;
}

message GetCapabilitiesResponse {
  zqnt.capability.v3.CapabilitySet capabilities = 1;
}

message ExecuteCommandRequest {
  zqnt.common.v3.RequestContext context = 1;
  zqnt.capability.v3.Command command = 2;
  // Assigned by the platform; the adapter uses it on every event of this run.
  string command_execution_id = 3;
}

message ExecuteCommandResponse {
  zqnt.capability.v3.CommandResult result = 1;
}

message CancelCommandRequest {
  zqnt.common.v3.RequestContext context = 1;
  string command_execution_id = 2;
  string reason = 3;
}

message CancelCommandResponse {
  zqnt.capability.v3.CommandResult result = 1;
}

message ManualControlInput {
  // -1..1 each.
  float roll = 1;
  float pitch = 2;
  float yaw = 3;
  float throttle = 4;
  optional float gimbal_pitch = 5;
}

message StreamManualControlRequest {
  zqnt.common.v3.AssetRef asset = 1;
  ManualControlInput input = 2;
  google.protobuf.Timestamp sent_at = 3;
}

message StreamManualControlResponse {
  // Inputs accepted over the whole stream.
  int64 accepted_inputs = 1;
  zqnt.common.v3.Error error = 2;
}

message StreamDetectionsRequest {
  zqnt.common.v3.AssetRef asset = 1;
  // Unset = the asset's primary stream.
  string stream_url = 2;
}

message BoundingBox {
  // Normalised 0..1 relative to the frame.
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
}

message Detection {
  string object_id = 1;
  string object_type = 2;
  float confidence = 3;
  BoundingBox bounding_box = 4;
  zqnt.common.v3.GeoPoint position = 5;
  // Radar geometry, relative to the sensor that saw the object.
  optional double range_meters = 6;
  // Degrees clockwise from true north.
  optional double bearing_degrees = 7;
  // Degrees above the horizon.
  optional double elevation_degrees = 8;
  // m/s, of the object when the sensor tracks it.
  optional double speed = 9;
  // Degrees clockwise from true north, the direction the object moves.
  optional double heading_degrees = 10;
  // Whose the object is, apart from what it is (object_type). The platform sets it on ingest; an
  // adapter whose sensor knows (IFF, a simulator's own drones) may set it, and the platform keeps
  // that as a SENSOR source.
  Identity identity = 11;
  // What the identity rests on.
  repeated IdentitySource identity_sources = 12;
  IdentitySetBy identity_set_by = 13;
  // The own asset the object is taken for, when the identity is ASSUMED_FRIEND or FRIEND.
  string friendly_asset_sn = 14;
  // The object could be more than one own asset, another object claims the same own asset, or the
  // sources contradict each other. Position alone never makes such an object friendly.
  bool identity_ambiguous = 15;
  // The track the platform put this report in: one object over time, across the sensors that saw
  // it. Set on ingest; empty for a report that was not tracked. An adapter leaves it empty.
  string track_id = 16;
  // The site the object was seen at: the sensor's site, otherwise the organization's smallest site
  // whose area holds the position. Set on ingest; empty when neither names one. An adapter leaves
  // it empty.
  string site_id = 17;
  // What the object broadcasts about itself, on a report of a Remote ID or ADS-B receiver: the
  // receiver is the sensor, the position is the broadcast one.
  Broadcast broadcast = 18;
  // The position was computed from range, bearing and elevation and the sensor's own position, not
  // measured. The platform sets it when it derives one on ingest; an adapter that projects a
  // range/bearing report itself sets it too.
  bool position_derived = 19;
}

enum BroadcastKind {
  BROADCAST_KIND_UNSPECIFIED = 0;
  // Drone Remote ID (ASTM F3411, ASD-STAN EN 4709-002), heard over Bluetooth or Wi-Fi.
  BROADCAST_KIND_REMOTE_ID = 1;
  // ADS-B (1090 MHz extended squitter), e.g. from a dump1090/readsb receiver.
  BROADCAST_KIND_ADSB = 2;
}

message Broadcast {
  BroadcastKind kind = 1;
  // REMOTE_ID: the UAS serial number (ANSI/CTA-2063) or session id. ADSB: the 24-bit ICAO
  // address in upper-case hex.
  string id = 2;
  // ADSB: the flight number or registration the aircraft transmits.
  string callsign = 3;
  // REMOTE_ID: the operator's registration number.
  string operator_id = 4;
  // REMOTE_ID: where the operator (the remote pilot) is, when broadcast.
  zqnt.common.v3.GeoPoint operator_position = 5;
  // REMOTE_ID: the free text of the self-ID message.
  string description = 6;
  // ADSB: the transponder code.
  string squawk = 7;
  // REMOTE_ID: the UA type, e.g. HELICOPTER_OR_MULTIROTOR. ADSB: the emitter category, e.g. A3.
  string category = 8;
}

// Standard identity after NATO APP-6.
enum Identity {
  IDENTITY_UNSPECIFIED = 0;
  // Not evaluated yet.
  IDENTITY_PENDING = 1;
  // Evaluated; nothing says whose it is.
  IDENTITY_UNKNOWN = 2;
  IDENTITY_ASSUMED_FRIEND = 3;
  IDENTITY_FRIEND = 4;
  // Neither friend nor foe, e.g. civil traffic broadcasting Remote ID.
  IDENTITY_NEUTRAL = 5;
  IDENTITY_SUSPECT = 6;
  IDENTITY_HOSTILE = 7;
}

enum IdentitySetBy {
  IDENTITY_SET_BY_UNSPECIFIED = 0;
  IDENTITY_SET_BY_PLATFORM = 1;
  IDENTITY_SET_BY_OPERATOR = 2;
}

enum IdentitySourceKind {
  IDENTITY_SOURCE_KIND_UNSPECIFIED = 0;
  // Position and time compared with the latest telemetry of the organization's own assets.
  IDENTITY_SOURCE_KIND_POSITION = 1;
  // The sensor said so: a FRIENDLY_* class, or an identity the adapter set.
  IDENTITY_SOURCE_KIND_SENSOR = 2;
  IDENTITY_SOURCE_KIND_OPERATOR = 3;
  // Earlier reports of the same track were matched to the own asset named in asset_sn; the track
  // keeps that link until a report contradicts it.
  IDENTITY_SOURCE_KIND_TRACK = 4;
  // The object was in the planned corridor of a running Application of the organization, at about
  // the planned time: execution_id names the run, asset_sn the asset flying it. Supports
  // ASSUMED_FRIEND, never FRIEND, and only while that asset's own position is not known.
  IDENTITY_SOURCE_KIND_ROUTE = 5;
  // A Remote ID broadcast: the report's own, or one heard at the object's position.
  IDENTITY_SOURCE_KIND_REMOTE_ID = 6;
  // An ADS-B broadcast: the report's own, or one heard at the object's position.
  IDENTITY_SOURCE_KIND_ADSB = 7;
  // The broadcast is on the site's allow-list of cooperative traffic (partners, police).
  IDENTITY_SOURCE_KIND_ALLOW_LIST = 8;
}

message IdentitySource {
  IdentitySourceKind kind = 1;
  // What this source says.
  Identity identity = 2;
  // POSITION: the own asset matched or, when none matched, the nearest one compared. ROUTE: the
  // asset flying the run. REMOTE_ID, ADSB, ALLOW_LIST: the own asset the broadcast stands for.
  string asset_sn = 3;
  // POSITION: metres between the object and that asset's latest position. ROUTE: metres from the
  // planned route. REMOTE_ID, ADSB: metres from the broadcast position.
  optional double distance_meters = 4;
  // POSITION: seconds between the detection and that asset's latest telemetry. ROUTE: seconds off
  // the planned time. REMOTE_ID, ADSB: seconds between the detection and the broadcast.
  optional double age_seconds = 5;
  // 0..1.
  float confidence = 6;
  // REMOTE_ID, ADSB, ALLOW_LIST: the broadcast the source rests on.
  Broadcast broadcast = 7;
  // ROUTE: the run whose corridor the object was in.
  string execution_id = 8;
  // ALLOW_LIST: the entry's name, e.g. "Police helicopter Christoph 1".
  string label = 9;
}

message StreamDetectionsResponse {
  zqnt.common.v3.AssetRef asset = 1;
  repeated Detection detections = 2;
  string stream_url = 3;
  google.protobuf.Timestamp observed_at = 4;
}

message ReportCapabilitiesRequest {
  zqnt.capability.v3.CapabilitySet capabilities = 1;
}

message ReportCapabilitiesResponse {
  string accepted_revision = 1;
}

message PublishCommandEventRequest {
  zqnt.capability.v3.CommandEvent event = 1;
}

message PublishCommandEventResponse {}
